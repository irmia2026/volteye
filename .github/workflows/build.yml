name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build volteye.exe
        run: |
          go build -trimpath -ldflags "-s -w" -o dist/volteye.exe ./cmd/volteye

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: volteye-windows-x64
          path: dist/volteye.exe
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/volteye.exe
          generate_release_notes: true
